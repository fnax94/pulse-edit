name: Build macOS (signed + notarized)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to upload to (e.g. pulse-edit-v1.5)'
        required: true
        default: 'pulse-edit-v1.5'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    env:
      KEYCHAIN_PROFILE: gha-notarize
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller customtkinter librosa scipy soundfile numba soxr pillow scikit-learn requests

      - name: Download static ffmpeg (arm64)
        run: |
          mkdir -p resources
          curl -L -o ffmpeg.zip "https://www.osxexperts.net/ffmpeg711arm.zip"
          unzip -o ffmpeg.zip -d resources/
          chmod +x resources/ffmpeg
          ls -la resources/ffmpeg
          file resources/ffmpeg

      - name: Build with PyInstaller
        run: |
          pyinstaller --name "PulseEdit" \
            --windowed --noconfirm \
            --icon resources/icon.icns \
            --collect-all customtkinter \
            --add-binary "resources/ffmpeg:." \
            --hidden-import librosa \
            --hidden-import librosa.util \
            --hidden-import librosa.filters \
            --hidden-import librosa.feature \
            --hidden-import librosa.beat \
            --hidden-import librosa.onset \
            --hidden-import librosa.core \
            --hidden-import scipy.signal \
            --hidden-import scipy.fft \
            --hidden-import scipy.ndimage \
            --hidden-import soundfile \
            --hidden-import sklearn.utils._cython_blas \
            --hidden-import sklearn.neighbors.typedefs \
            --hidden-import sklearn.neighbors._partition_nodes \
            --hidden-import sklearn.tree._utils \
            --hidden-import numba \
            --hidden-import soxr \
            --hidden-import numpy \
            --hidden-import app.core.clip_analyzer \
            --hidden-import app.core.editor \
            --hidden-import app.core.mood_analyzer \
            --hidden-import app.core.custom_patterns \
            main.py

      - name: Import Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_number }}
        run: |
          KC=build.keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KC
          security set-keychain-settings -lut 21600 $KC
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KC
          security list-keychains -d user -s $KC $(security list-keychains -d user | tr -d '"')
          echo "$P12_BASE64" | base64 --decode > cert.p12
          security import cert.p12 -k $KC -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KC
          rm cert.p12
          security find-identity -v -p codesigning $KC

      - name: Save notarytool credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool store-credentials "$KEYCHAIN_PROFILE" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"

      - name: Patch Info.plist + codesign + notarize
        env:
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          APP="dist/PulseEdit.app"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.abtools.pulseedit" "$APP/Contents/Info.plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string com.abtools.pulseedit" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription 'Pulse Edit analizza file audio per generare beat markers.'" "$APP/Contents/Info.plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Pulse Edit analizza file audio per generare beat markers.'" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :NSAppleEventsUsageDescription 'Pulse Edit invia comandi a DaVinci Resolve per importare i marker.'" "$APP/Contents/Info.plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :NSAppleEventsUsageDescription string 'Pulse Edit invia comandi a DaVinci Resolve per importare i marker.'" "$APP/Contents/Info.plist"

          # Sign nested binaries first
          find "$APP/Contents" -type f \( -name "*.dylib" -o -name "*.so" -o -perm +111 \) -print0 \
            | xargs -0 -I{} codesign --force --options runtime --timestamp --sign "$IDENTITY" "{}" 2>/dev/null || true

          codesign --force --deep --options runtime --timestamp \
            --entitlements entitlements.plist \
            --sign "$IDENTITY" "$APP"

          codesign --verify --deep --strict --verbose=2 "$APP"

          ZIP="dist/PulseEdit-macOS.zip"
          rm -f "$ZIP"
          ditto -c -k --keepParent "$APP" "$ZIP"

          xcrun notarytool submit "$ZIP" --keychain-profile "$KEYCHAIN_PROFILE" --wait

          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"

          rm -f "$ZIP"
          ditto -c -k --keepParent "$APP" "$ZIP"

      - name: Build DMG (signed)
        env:
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          brew install create-dmg
          APP="dist/PulseEdit.app"
          DMG="dist/PulseEdit-macOS.dmg"
          rm -f "$DMG"
          create-dmg \
            --volname "Pulse Edit" \
            --window-pos 200 120 \
            --window-size 640 400 \
            --icon-size 128 \
            --icon "PulseEdit.app" 160 200 \
            --hide-extension "PulseEdit.app" \
            --app-drop-link 480 200 \
            --no-internet-enable \
            "$DMG" \
            "$APP"
          codesign --force --sign "$IDENTITY" --timestamp "$DMG"
          ls -la "$DMG"

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.release_tag }}
        run: |
          VERSION="${TAG#pulse-edit-v}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Pulse Edit Studio v${VERSION}" --notes "Pulse Edit Studio v${VERSION} — macOS + Windows builds."
          gh release upload "$TAG" dist/PulseEdit-macOS.zip --clobber
          gh release upload "$TAG" dist/PulseEdit-macOS.dmg --clobber

      - name: Mirror macOS build to R2 (public download)
        # Uploads as PulseEdit-Studio-macOS.zip (the "Studio-" prefix
        # distinguishes the DR Studio build from the standalone Pulse Edit
        # free build in the shared pulseedit-releases bucket). The mirror
        # Worker strips the prefix in the Content-Disposition header so
        # downloaded files keep the friendly name "PulseEdit-macOS.zip".
        if: ${{ env.R2_ACCESS_KEY_ID != '' }}
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          pip install awscli --quiet
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION="auto"
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp "dist/PulseEdit-macOS.zip" \
            "s3://pulseedit-releases/PulseEdit-Studio-macOS.zip" \
            --endpoint-url "$ENDPOINT" \
            --content-type "application/zip"

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain build.keychain || true
