name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "app/**"
      - "resources/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install customtkinter librosa scipy soundfile pyinstaller numba soxr pillow scikit-learn requests

      - name: Download ffmpeg
        run: |
          curl -L -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          7z x ffmpeg.zip -offmpeg_extract
          copy ffmpeg_extract\ffmpeg-master-latest-win64-gpl\bin\ffmpeg.exe resources\ffmpeg.exe

      - name: Download Python embeddable for fusionscript
        run: |
          curl -L -o python-embed.zip https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip
          mkdir python_shim
          7z x python-embed.zip -opython_shim
          copy python_shim\python.exe python_shim\python3.exe

      - name: Build with PyInstaller (no PyArmor)
        run: |
          pyinstaller --name "PulseEdit" `
            --windowed `
            --noconfirm `
            --icon resources\icon.ico `
            --collect-all customtkinter `
            --add-binary "resources\ffmpeg.exe;." `
            --hidden-import librosa `
            --hidden-import librosa.util `
            --hidden-import librosa.filters `
            --hidden-import librosa.feature `
            --hidden-import librosa.beat `
            --hidden-import librosa.onset `
            --hidden-import librosa.core `
            --hidden-import scipy.signal `
            --hidden-import scipy.fft `
            --hidden-import soundfile `
            --hidden-import numba `
            --hidden-import soxr `
            --hidden-import numpy `
            --hidden-import app `
            --hidden-import app.i18n `
            --hidden-import app.core `
            --hidden-import app.core.resolve_bridge `
            --hidden-import app.core.beat_detector `
            --hidden-import app.core.clip_analyzer `
            --hidden-import app.core.editor `
            --hidden-import app.core.mood_analyzer `
            --hidden-import app.core.custom_patterns `
            --hidden-import scipy.ndimage `
            --hidden-import app.gui `
            --hidden-import app.gui.main_window `
            --hidden-import app.gui.license_dialog `
            --hidden-import app.licensing `
            --hidden-import app.licensing.lemon `
            --hidden-import app.licensing.storage `
            main.py

      - name: Bundle python_shim and resolve_worker into dist
        run: |
          xcopy /E /I python_shim dist\PulseEdit\python_shim
          copy app\core\resolve_worker.py dist\PulseEdit\resolve_worker.py

      - name: Remove legacy artifacts and clean dist
        run: |
          if (Test-Path "dist\PulseEdit\python-installer.exe") {
            Remove-Item "dist\PulseEdit\python-installer.exe" -Force
            Write-Host "Removed legacy python-installer.exe"
          }

      - name: Add README and Avvia launcher to dist root
        shell: pwsh
        run: |
          $readme = @"
          ============================================
            Pulse Edit v1.4 — Quick Start (Windows)
          ============================================

          Pulse Edit auto-detects beats in your audio and places markers on
          your DaVinci Resolve timeline so you can edit on the beat in seconds.

          ----- Two ways to install -----

          OPTION A (recommended) — PulseEdit-Setup.exe
              Standard Windows installer. Double-click the setup, follow the
              wizard. Creates desktop + Start Menu shortcuts and a clean
              uninstaller. Get it from https://pulseedit.com

          OPTION B — this ZIP (portable, no install)
              Keep the PulseEdit folder anywhere you want (Desktop, USB stick,
              etc.) and follow the steps below.

          ----- Requirements -----

          - Windows 10 or 11 (64-bit)
          - DaVinci Resolve Studio 18.x, 19.x or 20.x
            (the free edition does NOT allow external scripting, so Pulse Edit
            cannot connect to it)
          - In Resolve: Preferences > System > General >
            "External scripting using" set to "Local"

          ----- How to run (ZIP version) -----

          1. Extract this ZIP completely. Keep ALL files together inside the
             "PulseEdit" folder — moving "PulseEdit.exe" out by itself will
             NOT work, it needs the _internal\ and python_shim\ folders next
             to it.
          2. Open DaVinci Resolve and load a project + timeline.
          3. Double-click "PulseEdit.exe" (or "Avvia Pulse Edit.bat" if
             SmartScreen blocks the .exe).
          4. The first run, Windows SmartScreen may say "Windows protected
             your PC":
             - Click "More info"
             - Click "Run anyway"
             (Pulse Edit is safe — this warning appears for any app that is
             not yet code-signed by Microsoft.)
          5. The Pulse Edit window opens. You should see
             "Connected — Timeline 1 (xx fps)" in green.
          6. Pick the audio track, click "Detect Beats" — done.

          ----- Activating your license -----

          Click "Activate" in the bottom-right corner and paste the license
          key you received by email. The free trial allows 4 uses.

          ----- Troubleshooting -----

          * "Resolve not detected" — make sure Resolve is open AND a project
            is loaded AND scripting is set to "Local" in preferences.
          * "PulseEdit.exe won't start" — you probably moved or deleted the
            _internal\ or python_shim\ folder. Re-extract the original ZIP.
          * Antivirus warning — add the PulseEdit folder to your antivirus
            exclusions. Pulse Edit is safe; unsigned binaries sometimes
            trigger heuristic detections.
          * Need help? Email abramo.benedetti@gmail.com or DM @aki.vhs on Instagram.

          ----- What's inside this folder -----

          PulseEdit.exe              The application
          Avvia Pulse Edit.bat       Alternative launcher (use if SmartScreen
                                     blocks the .exe)
          python_shim\               Python runtime needed to talk to Resolve
          _internal\                 Application libraries (do not modify)
          resolve_worker.py          Bridge script for Resolve communication
          README.txt                 This file

          ----- About -----

          Pulse Edit is made by AB Tools — a small independent studio.
          We're not yet code-signed by Microsoft, so SmartScreen warnings
          are normal. The app contains zero telemetry and zero ads.
          "@
          $readme | Out-File -Encoding utf8 dist\PulseEdit\README.txt

          $bat = @"
          @echo off
          REM Quick launcher for Pulse Edit. If SmartScreen blocks PulseEdit.exe,
          REM right-click this file > Properties > Unblock, then double-click.
          start "" "%~dp0PulseEdit.exe"
          "@
          $bat | Out-File -Encoding ascii "dist\PulseEdit\Avvia Pulse Edit.bat"

      - name: List final dist contents (sanity check)
        shell: pwsh
        run: |
          Get-ChildItem dist\PulseEdit | Select-Object Name, Length

      - name: Create ZIP
        run: |
          cd dist
          7z a -tzip "..\PulseEdit-Windows.zip" "PulseEdit"

      - name: Generate Inno Setup script
        shell: pwsh
        run: |
          $iss = @'
          ; Pulse Edit installer — generated by build-windows.yml
          #define MyAppName "Pulse Edit"
          #define MyAppVersion "1.4.2"
          #define MyAppPublisher "AB Tools"
          #define MyAppURL "https://pulseedit.com"
          #define MyAppExeName "PulseEdit.exe"

          [Setup]
          AppId={{B7F3E8A0-9D2C-4F1B-A4E7-1C9D6B2A8F5E}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppVerName={#MyAppName} {#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          AppPublisherURL={#MyAppURL}
          AppSupportURL={#MyAppURL}
          AppUpdatesURL={#MyAppURL}
          DefaultDirName={autopf}\{#MyAppName}
          DefaultGroupName={#MyAppName}
          DisableProgramGroupPage=yes
          PrivilegesRequired=lowest
          PrivilegesRequiredOverridesAllowed=dialog
          ArchitecturesInstallIn64BitMode=x64compatible
          OutputDir=.
          OutputBaseFilename=PulseEdit-Setup
          SetupIconFile=resources\icon.ico
          UninstallDisplayIcon={app}\{#MyAppExeName}
          Compression=lzma2/max
          SolidCompression=yes
          WizardStyle=modern
          DisableWelcomePage=no

          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"

          [Files]
          Source: "dist\PulseEdit\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"
          Name: "{group}\Uninstall {#MyAppName}"; Filename: "{uninstallexe}"
          Name: "{autodesktop}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"

          [Run]
          Filename: "{app}\{#MyAppExeName}"; Description: "Launch {#MyAppName}"; Flags: nowait postinstall skipifsilent
          '@
          $iss | Out-File -Encoding utf8 setup.iss

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup not found at $iscc, installing via chocolatey"
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc setup.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
          Get-ChildItem PulseEdit-Setup.exe | Select-Object Name, Length

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload pulse-edit-v1.4 PulseEdit-Windows.zip --clobber
          gh release upload pulse-edit-v1.4 PulseEdit-Setup.exe --clobber
